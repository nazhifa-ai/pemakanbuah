<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemakan Buah - Hanya Panah Atas Bawah 🍎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2c3e50;
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        h1 {
            font-size: 2.3rem;
            color: #ffdd00;
            text-shadow: 0 0 10px #ffdd00;
            margin-bottom: 15px;
        }
        .info {
            width: 800px;
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        #notifikasi {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 100;
            display: none;
        }
        #gameCanvas {
            border: 3px solid #2ecc71;
            border-radius: 8px;
            background: #ecf0f1;
        }
        .tombol {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            padding: 10px 22px;
            background: #2ecc71;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #27ae60;
            box-shadow: 0 0 10px #2ecc71;
        }
        .kontrol-info {
            margin-top: 10px;
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1>🍎 PEMAKAN BUAH 🍎</h1>
    <div id="notifikasi"></div>

    <div class="info">
        <div>⏱️ Waktu: <span id="waktu">60</span> dtk</div>
        <div>📈 Level: <span id="level">1</span></div>
        <div>⭐ Skor Kamu: <span id="skor">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="tombol">
        <button onclick="mulaiGame()">🎮 Mulai Main</button>
        <button onclick="resetGame()">🔄 Ulangi</button>
    </div>

    <div class="kontrol-info">
        ✅ GUNAKAN HANYA: ⬆️ (Atas) & ⬇️ (Bawah)
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let waktu = 60, level = 1, skor = 0;
        let gameJalan = false;

        // Posisi Pemain & Buah
        const pemain = {x: 80, y: 180, ukuran: 30, kecepatan: 6, warna: '#3498db'};
        const buah = {x: 400, y: acak(50,350), ukuran: 25, warna: '#e67e22'};

        // Penyimpanan Tombol
        const tombol = {};
        window.addEventListener('keydown', function(e) {
            tombol[e.key] = true;
            // Mencegah halaman ikut bergulir saat tekan panah
            if(["ArrowUp","ArrowDown"].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', function(e) {
            tombol[e.key] = false;
        });

        function acak(min, max) { return Math.floor(Math.random()*(max-min)+min); }

        function notifikasi(teks) {
            const n = document.getElementById('notifikasi');
            n.innerText = teks; n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 2000);
        }

        function mulaiGame() {
            if (gameJalan) return;
            gameJalan = true;
            notifikasi('Permainan Dimulai! 🎮');
            
            const timer = setInterval(() => {
                if (!gameJalan) { clearInterval(timer); return; }
                waktu--;
                document.getElementById('waktu').innerText = waktu;
                if (waktu <= 0) {
                    gameJalan = false;
                    notifikasi(`Selesai! Skor Akhir: ${skor} 🎉`);
                    clearInterval(timer);
                }
            }, 1000);

            loopGame();
        }

        function resetGame() {
            gameJalan = false;
            waktu = 60; level = 1; skor = 0;
            pemain.y = 180;
            buah.y = acak(50,350);
            updateUI(); gambarLatar();
        }

        function loopGame() {
            if (!gameJalan) return;

            gerakPemain();
            cekMakan();
            gambarLatar(); gambarPemain(); gambarBuah();
            updateUI();

            requestAnimationFrame(loopGame);
        }

        // === KONTROL YANG PASTI BERJALAN ===
        function gerakPemain() {
            if (tombol['ArrowUp']) {
                if (pemain.y > 0) pemain.y -= pemain.kecepatan;
            }
            if (tombol['ArrowDown']) {
                if (pemain.y < canvas.height - pemain.ukuran) pemain.y += pemain.kecepatan;
            }
        }

        function cekMakan() {
            if (Math.abs(pemain.x - buah.x) < 35 && Math.abs(pemain.y - buah.y) < 35) {
                skor++;
                buah.y = acak(50,350);
                cekLevel();
            }
        }

        function cekLevel() {
            if (skor % 5 === 0 && skor > 0) {
                level++;
                notifikasi(`Level ${level}! 🚀`);
                waktu += 5;
            }
        }

        // Gambar Tampilan
        function gambarLatar() { ctx.fillStyle='#ecf0f1'; ctx.fillRect(0,0,canvas.width,canvas.height); }
        function gambarPemain() {
            ctx.fillStyle = pemain.warna; ctx.shadowColor = pemain.warna; ctx.shadowBlur=8;
            ctx.beginPath(); ctx.arc(pemain.x, pemain.y, pemain.ukuran/2, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
        }
        function gambarBuah() {
            ctx.fillStyle = buah.warna; ctx.shadowColor='#e67e22'; ctx.shadowBlur=10;
            ctx.beginPath(); ctx.arc(buah.x, buah.y, buah.ukuran/2, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            ctx.fillStyle='#27ae60'; ctx.fillRect(buah.x+5, buah.y-15, 5, 8);
        }

        function updateUI() {
            document.getElementById('waktu').innerText=waktu;
            document.getElementById('level').innerText=level;
            document.getElementById('skor').innerText=skor;
        }

        // Gambar Awal
        gambarLatar(); gambarPemain(); gambarBuah();
    </script>
</body>
</html>
