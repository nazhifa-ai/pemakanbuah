<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacing Pemakan Buah 🍎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #EDE7F6, #D1C4E9, #C3B1E1);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* ✨ LATAR BELAKANG ANIMASI ✨ */
        .latar-animasi {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .lingkaran {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            animation: mengembang 10s infinite ease-in-out;
        }
        .bintang-bergerak {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff, 0 0 15px #E1BEE7;
            animation: kelapkelip 3s infinite alternate ease-in-out;
        }
        @keyframes mengembang {
            0% { transform: scale(0.5); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(0.5); opacity: 0.4; }
        }
        @keyframes kelapkelip {
            0% { opacity: 0.4; transform: translateY(0); }
            100% { opacity: 1; transform: translateY(-15px); }
        }

        /* LOGO */
        .logo-di-atas {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            z-index: 2;
        }
        .logo-di-atas img {
            height: 72px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        /* JUDUL */
        h1 {
            font-size: 2.5rem;
            color: #6A1B9A;
            text-align: center;
            margin-bottom: 18px;
            font-weight: 700;
            text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.5);
            z-index: 2;
        }

        /* INFO */
        .info {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            z-index: 2;
        }
        .info-item {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 12px 28px;
            border-radius: 30px;
            color: #6A1B9A;
            font-weight: 600;
            font-size: 1.15rem;
            box-shadow: 0 4px 15px rgba(106, 27, 154, 0.15);
        }

        /* AREA KANVAS */
        #gameCanvas {
            border: 4px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(106, 27, 154, 0.25), inset 0 0 20px rgba(255,255,255,0.2);
            background: rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 2;
        }

        /* ✨ TULISAN TENGAH ✨ */
        .tulisan-tengah {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #F3E5F5, #E1BEE7, #CE93D8);
            padding: 22px 55px;
            border-radius: 35px;
            color: #4A148C;
            font-size: 1.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(106, 27, 154, 0.3);
            z-index: 10;
            transition: all 0.3s ease;
            border: 3px solid #FFFFFF;
            animation: naikTurunTulisan 2s infinite alternate ease-in-out;
        }
        @keyframes naikTurunTulisan {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.05); }
        }
        .tulisan-tengah:hover {
            box-shadow: 0 0 40px #CE93D8;
        }

        /* PETUNJUK */
        .petunjuk {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            color: #6A1B9A;
            font-weight: 500;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- ✨ LATAR BELAKANG ANIMASI ✨ -->
    <div class="latar-animasi">
        <div class="lingkaran" style="width: 400px; height: 400px; top: -100px; left: -50px; animation-delay: 0s;"></div>
        <div class="lingkaran" style="width: 300px; height: 300px; bottom: -50px; right: -50px; animation-delay: 3s;"></div>
        <div class="bintang-bergerak" style="width: 8px; height: 8px; top: 15%; left: 15%; animation-delay: 0s;"></div>
        <div class="bintang-bergerak" style="width: 12px; height: 12px; top: 25%; left: 80%; animation-delay: 0.5s;"></div>
        <div class="bintang-bergerak" style="width: 6px; height: 6px; top: 70%; left: 10%; animation-delay: 1s;"></div>
        <div class="bintang-bergerak" style="width: 10px; height: 10px; top: 60%; left: 90%; animation-delay: 1.5s;"></div>
        <div class="bintang-bergerak" style="width: 7px; height: 7px; top: 40%; left: 50%; animation-delay: 2s;"></div>
        <div class="bintang-bergerak" style="width: 9px; height: 9px; top: 80%; left: 70%; animation-delay: 2.5s;"></div>
    </div>

    <div class="logo-di-atas">
        <img src="1sanden.jpeg" alt="Logo Sanden">
        <img src="logosklh.jpeg" alt="Logo Sekolah">
        <img src="mk.jpeg" alt="Logo MOKO">
        <img src="rpl.jpeg" alt="Logo RPL">
    </div>

    <h1>🐍 CACING PEMAKAN BUAH 🍎</h1>

    <div class="info">
        <div class="info-item">📈 Level: <span id="level">1</span></div>
        <div class="info-item">⭐ Skor: <span id="skor">0</span></div>
        <div class="info-item">🔗 Panjang: <span id="panjang">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="tulisanTengah" class="tulisan-tengah" onclick="klikTengah()">MULAI PERMAINAN</div>

    <div class="petunjuk">
        Gunakan tombol ⬆️ ⬇️ ⬅️ ➡️ di keyboard untuk menggerakkan cacing
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const elemenTulisan = document.getElementById('tulisanTengah');
        
        let level = 1;
        let skor = 0;
        let gameJalan = false;
        let kecepatan = 3;

        // Ukuran blok cacing
        const ukuranBlok = 25;
        const pemain = {
            x: 100,
            y: 200,
            ukuran: ukuranBlok,
            arahX: kecepatan,
            arahY: 0,
            ekor: []
        };

        const buah = {
            x: Math.floor(Math.random() * ((canvas.width - ukuranBlok) / ukuranBlok)) * ukuranBlok,
            y: Math.floor(Math.random() * ((canvas.height - ukuranBlok) / ukuranBlok)) * ukuranBlok,
            ukuran: ukuranBlok
        };

        const tombol = {};
        window.addEventListener('keydown', e => {
            tombol[e.key] = true;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', e => tombol[e.key] = false);

        function klikTengah() {
            if (!gameJalan) {
                gameJalan = true;
                elemenTulisan.style.display = 'none';
                jalankanGame();
            }
        }

        function jalankanGame() {
            if (!gameJalan) return;

            // Ubah arah
            if (tombol['ArrowUp'] && pemain.arahY !== kecepatan) {
                pemain.arahX = 0;
                pemain.arahY = -kecepatan;
            }
            if (tombol['ArrowDown'] && pemain.arahY !== -kecepatan) {
                pemain.arahX = 0;
                pemain.arahY = kecepatan;
            }
            if (tombol['ArrowLeft'] && pemain.arahX !== kecepatan) {
                pemain.arahX = -kecepatan;
                pemain.arahY = 0;
            }
            if (tombol['ArrowRight'] && pemain.arahX !== -kecepatan) {
                pemain.arahX = kecepatan;
                pemain.arahY = 0;
            }

            // Simpan ekor
            pemain.ekor.unshift({x: pemain.x, y: pemain.y});
            while (pemain.ekor.length > skor) pemain.ekor.pop();

            // Gerakkan
            pemain.x += pemain.arahX;
            pemain.y += pemain.arahY;

            // ✅ DIPERBAIKI: BATAS TEPENYA PAS SEKALI, BISA SAMPAI UJUNG
            if (pemain.x < 0 || pemain.x > canvas.width - pemain.ukuran ||
                pemain.y < 0 || pemain.y > canvas.height - pemain.ukuran) {
                resetGame();
                return;
            }

            // Makan buah
            if (Math.abs(pemain.x - buah.x) < pemain.ukuran && 
                Math.abs(pemain.y - buah.y) < pemain.ukuran) {
                skor++;
                buah.x = Math.floor(Math.random() * ((canvas.width - ukuranBlok) / ukuranBlok)) * ukuranBlok;
                buah.y = Math.floor(Math.random() * ((canvas.height - ukuranBlok) / ukuranBlok)) * ukuranBlok;

                if (skor % 5 === 0) {
                    level++;
                    if (kecepatan < 6) kecepatan += 0.25;
                }
            }

            gambarLatarDalam();
            gambarCacingKotak();
            gambarBuah();
            updateUI();

            requestAnimationFrame(jalankanGame);
        }

        function resetGame() {
            gameJalan = false;
            level = 1;
            skor = 0;
            kecepatan = 3;
            pemain.x = 100;
            pemain.y = 200;
            pemain.arahX = kecepatan;
            pemain.arahY = 0;
            pemain.ekor = [];
            buah.x = Math.floor(Math.random() * ((canvas.width - ukuranBlok) / ukuranBlok)) * ukuranBlok;
            buah.y = Math.floor(Math.random() * ((canvas.height - ukuranBlok) / ukuranBlok)) * ukuranBlok;
            
            elemenTulisan.innerText = 'ULANGI';
            elemenTulisan.style.display = 'block';
            gambarLatarDalam();
        }

        function gambarLatarDalam() {
            let grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
            grad.addColorStop(0, '#FFFFFF');
            grad.addColorStop(1, '#F8F5FF');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,canvas.width,canvas.height);
        }

        // Bentuk cacing kotak sudut bulat
        function gambarCacingKotak() {
            // Ekor
            for(let i=0; i<pemain.ekor.length; i++) {
                ctx.fillStyle = `hsl(270, 70%, ${60 - i*2}%)`;
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#D1C4E9';
                roundRect(ctx, pemain.ekor[i].x+1, pemain.ekor[i].y+1, pemain.ukuran-2, pemain.ukuran-2, 6);
                ctx.fill();
            }
            // Kepala
            ctx.fillStyle = '#6A1B9A';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#9C27B0';
            roundRect(ctx, pemain.x+1, pemain.y+1, pemain.ukuran-2, pemain.ukuran-2, 8);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Mata
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(pemain.x+8, pemain.y+8, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(pemain.x+17, pemain.y+8, 3, 0, Math.PI*2); ctx.fill();
        }

        // Fungsi kotak sudut membulat
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function gambarBuah() {
            ctx.fillStyle = '#EF5350';
            ctx.shadowColor = '#FFCDD2';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(buah.x+buah.ukuran/2, buah.y+buah.ukuran/2, buah.ukuran/2-2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(buah.x+buah.ukuran/2-1, buah.y-5, 2, 6);
        }

        function updateUI() {
            document.getElementById('level').innerText = level;
            document.getElementById('skor').innerText = skor;
            document.getElementById('panjang').innerText = skor;
        }

        gambarLatarDalam();
    </script>
</body>
</html>
