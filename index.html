<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacing Pemakan Buah 🍎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #EDE7F6, #D1C4E9);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* LOGO */
        .logo-di-atas {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }
        .logo-di-atas img {
            height: 72px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(123, 31, 162, 0.15);
        }

        /* JUDUL */
        h1 {
            font-size: 2.5rem;
            color: #6A1B9A;
            text-align: center;
            margin-bottom: 18px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(106, 27, 154, 0.2);
        }

        /* INFO */
        .info {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
        }
        .info-item {
            background: linear-gradient(135deg, #9575CD, #7E57C2);
            padding: 12px 28px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 1.15rem;
            box-shadow: 0 4px 15px rgba(126, 87, 194, 0.35);
            letter-spacing: 0.5px;
        }

        /* AREA KANVAS - TINGGI DIPERBESAR & BATAS DIPASANGKAN */
        #gameCanvas {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(106, 27, 154, 0.25);
            background: #FAF7FF;
            position: relative;
        }

        /* ✨ TULISAN TENGAH ✨ */
        .tulisan-tengah {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #7E57C2, #6A1B9A);
            padding: 22px 55px;
            border-radius: 35px;
            color: white;
            font-size: 1.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(106, 27, 154, 0.4);
            z-index: 10;
            transition: all 0.3s ease;
            border: 3px solid #B39DDB;
        }
        .tulisan-tengah:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 10px 30px rgba(106, 27, 154, 0.5);
        }

        /* PETUNJUK */
        .petunjuk {
            margin-top: 20px;
            background: rgba(255,255,255,0.85);
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            color: #6A1B9A;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(106, 27, 154, 0.1);
        }
    </style>
</head>
<body>

    <div class="logo-di-atas">
        <img src="1sanden.jpeg" alt="Logo Sanden">
        <img src="logosklh.jpeg" alt="Logo Sekolah">
        <img src="mk.jpeg" alt="Logo MOKO">
        <img src="rpl.jpeg" alt="Logo RPL">
    </div>

    <h1>🐍 CACING PEMAKAN BUAH 🍎</h1>

    <div class="info">
        <div class="info-item">📈 Level: <span id="level">1</span></div>
        <div class="info-item">⭐ Skor: <span id="skor">0</span></div>
        <div class="info-item">🔗 Panjang: <span id="panjang">0</span></div>
    </div>

    <!-- ✨ TINGGI KANVAS DIPERBESAR JADI 450 AGAR CUKUP SAMPAI BAWAH ✨ -->
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="tulisanTengah" class="tulisan-tengah" onclick="klikTengah()">MULAI PERMAINAN</div>

    <div class="petunjuk">
        Gunakan tombol ⬆️ ⬇️ ⬅️ ➡️ di keyboard untuk menggerakkan cacing
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const elemenTulisan = document.getElementById('tulisanTengah');
        
        let level = 1;
        let skor = 0;
        let gameJalan = false;
        let kecepatanDasar = 3;

        // Ukuran blok pas, mudah diatur
        const ukuranBlok = 25;
        const pemain = {
            x: 100,
            y: 200,
            ukuran: ukuranBlok,
            arahX: kecepatanDasar,
            arahY: 0,
            ekor: []
        };

        const buah = {
            x: Math.floor(Math.random() * ((canvas.width - ukuranBlok) / ukuranBlok)) * ukuranBlok,
            y: Math.floor(Math.random() * ((canvas.height - ukuranBlok) / ukuranBlok)) * ukuranBlok,
            ukuran: ukuranBlok
        };

        const tombol = {};
        window.addEventListener('keydown', e => {
            tombol[e.key] = true;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', e => tombol[e.key] = false);

        // KLIK MULAI - BERFUNGSI BAIK
        function klikTengah() {
            if (!gameJalan) {
                gameJalan = true;
                elemenTulisan.style.display = 'none';
                jalankanGame();
            }
        }

        // LOGIKA UTAMA LENGKAP
        function jalankanGame() {
            if (!gameJalan) return;

            // UBAH ARAH LANCAR
            if (tombol['ArrowUp'] && pemain.arahY !== kecepatanDasar) {
                pemain.arahX = 0;
                pemain.arahY = -kecepatanDasar;
            }
            if (tombol['ArrowDown'] && pemain.arahY !== -kecepatanDasar) {
                pemain.arahX = 0;
                pemain.arahY = kecepatanDasar;
            }
            if (tombol['ArrowLeft'] && pemain.arahX !== kecepatanDasar) {
                pemain.arahX = -kecepatanDasar;
                pemain.arahY = 0;
            }
            if (tombol['ArrowRight'] && pemain.arahX !== -kecepatanDasar) {
                pemain.arahX = kecepatanDasar;
                pemain.arahY = 0;
            }

            // EKOR TERJAGA BAIK
            pemain.ekor.unshift({x: pemain.x, y: pemain.y});
            while (pemain.ekor.length > skor) pemain.ekor.pop();

            // GERAK
            pemain.x += pemain.arahX;
            pemain.y += pemain.arahY;

            // ✅ BATAS PAS: BISA SAMPAI SANGAT TEPI / BAWAH
            if (pemain.x < 0 || pemain.x > canvas.width - pemain.ukuran ||
                pemain.y < 0 || pemain.y > canvas.height - pemain.ukuran) {
                resetGame();
                return;
            }

            // MAKAN BUAH
            if (pemain.x === buah.x && pemain.y === buah.y) {
                skor++;
                buah.x = Math.floor(Math.random() * ((canvas.width - ukuranBlok) / ukuranBlok)) * ukuranBlok;
                buah.y = Math.floor(Math.random() * ((canvas.height - ukuranBlok) / ukuranBlok)) * ukuranBlok;

                if (skor % 5 === 0) {
                    level++;
                    if (kecepatanDasar < 6) kecepatanDasar += 0.25;
                }
            }

            gambarLatar();
            gambarCacing();
            gambarBuah();
            updateUI();

            requestAnimationFrame(jalankanGame);
        }

        function resetGame() {
            gameJalan = false;
            level = 1;
            skor = 0;
            kecepatanDasar = 3;
            pemain.x = 100;
            pemain.y = 200;
            pemain.arahX = kecepatanDasar;
            pemain.arahY = 0;
            pemain.ekor = [];
            buah.x = Math.floor(Math.random() * ((canvas.width - ukuranBlok) / ukuranBlok)) * ukuranBlok;
            buah.y = Math.floor(Math.random() * ((canvas.height - ukuranBlok) / ukuranBlok)) * ukuranBlok;
            
            elemenTulisan.innerText = 'ULANGI';
            elemenTulisan.style.display = 'block';
            gambarLatar();
        }

        function gambarLatar() {
            ctx.fillStyle = '#FAF7FF';
            ctx.fillRect(0,0,canvas.width,canvas.height);
        }

        // BENTUK CACING KOTAK SUDUT BULAT
        function gambarCacing() {
            // Ekor
            for(let i=0; i<pemain.ekor.length; i++) {
                ctx.fillStyle = `hsl(270, 70%, ${62 - i*2}%)`;
                kotakBulat(ctx, pemain.ekor[i].x+1, pemain.ekor[i].y+1, pemain.ukuran-2, pemain.ukuran-2, 6);
                ctx.fill();
            }
            // Kepala
            ctx.fillStyle = '#6A1B9A';
            kotakBulat(ctx, pemain.x+1, pemain.y+1, pemain.ukuran-2, pemain.ukuran-2, 8);
            ctx.fill();

            // Mata
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(pemain.x+8, pemain.y+8, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(pemain.x+17, pemain.y+8, 3, 0, Math.PI*2); ctx.fill();
        }

        // Fungsi kotak sudut membulat
        function kotakBulat(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function gambarBuah() {
            ctx.fillStyle = '#EF5350';
            ctx.beginPath();
            ctx.arc(buah.x+buah.ukuran/2, buah.y+buah.ukuran/2, buah.ukuran/2-2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#2E7D32';
            ctx.fillRect(buah.x+buah.ukuran/2-1, buah.y-5, 2, 6);
        }

        function updateUI() {
            document.getElementById('level').innerText = level;
            document.getElementById('skor').innerText = skor;
            document.getElementById('panjang').innerText = skor;
        }

        // Tampilan awal
        gambarLatar();
    </script>
</body>
</html>
