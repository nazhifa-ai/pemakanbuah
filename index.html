<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacing Pemakan Buah 🍎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #EDE7F6, #D1C4E9);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* LOGO */
        .logo-di-atas {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }
        .logo-di-atas img {
            height: 72px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(123, 31, 162, 0.15);
        }

        /* JUDUL */
        h1 {
            font-size: 2.5rem;
            color: #6A1B9A;
            text-align: center;
            margin-bottom: 18px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(106, 27, 154, 0.2);
        }

        /* INFO */
        .info {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
        }
        .info-item {
            background: linear-gradient(135deg, #9575CD, #7E57C2);
            padding: 12px 28px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 1.15rem;
            box-shadow: 0 4px 15px rgba(126, 87, 194, 0.35);
            letter-spacing: 0.5px;
        }

        /* AREA KANVAS */
        #gameCanvas {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(106, 27, 154, 0.25);
            background: #FAF7FF;
            position: relative;
        }

        /* ✨ TULISAN TENGAH ✨ */
        .tulisan-tengah {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #7E57C2, #6A1B9A);
            padding: 22px 55px;
            border-radius: 35px;
            color: white;
            font-size: 1.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(106, 27, 154, 0.4);
            z-index: 10;
            transition: all 0.3s ease;
            border: 3px solid #B39DDB;
        }
        .tulisan-tengah:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 10px 30px rgba(106, 27, 154, 0.5);
        }

        /* PETUNJUK */
        .petunjuk {
            margin-top: 20px;
            background: rgba(255,255,255,0.85);
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            color: #6A1B9A;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(106, 27, 154, 0.1);
        }
    </style>
</head>
<body>

    <div class="logo-di-atas">
        <img src="1sanden.jpeg" alt="Logo Sanden">
        <img src="logosklh.jpeg" alt="Logo Sekolah">
        <img src="mk.jpeg" alt="Logo MOKO">
        <img src="rpl.jpeg" alt="Logo RPL">
    </div>

    <h1>🐍 CACING PEMAKAN BUAH 🍎</h1>

    <div class="info">
        <div class="info-item">📈 Level: <span id="level">1</span></div>
        <div class="info-item">⭐ Skor: <span id="skor">0</span></div>
        <div class="info-item">🔗 Panjang: <span id="panjang">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="tulisanTengah" class="tulisan-tengah" onclick="klikTengah()">MULAI PERMAINAN</div>

    <div class="petunjuk">
        Gunakan tombol ⬆️ ⬇️ ⬅️ ➡️ di keyboard untuk menggerakkan cacing
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const elemenTulisan = document.getElementById('tulisanTengah');
        
        // VARIABEL BERSIH, TIDAK ADA BATAS
        let level = 1;
        let skor = 0;
        let gameJalan = false;
        let kecepatanDasar = 3;

            x: 100,
            y: 200,
            ukuran: 25,
            arahX: kecepatanDasar,
            arahY: 0,
            ekor: []

            x: Math.floor(Math.random() * 750) + 25,
            y: Math.floor(Math.random() * 350) + 25,
            ukuran: 22
        };

        const tombol = {};
        window.addEventListener('keydown', e => {
            tombol[e.key] = true;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', e => tombol[e.key] = false);

            if (!gameJalan) {
                gameJalan = true;
                elemenTulisan.style.display = 'none';
                jalankanGame();
            }
        }
