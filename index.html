<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacing Pemakan Buah 🍎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body {
            background: linear-gradient(to bottom, #B8A9C9, #F5F0FF);
            min-height: 100vh;
            padding: 20px;
            color: #4A4063;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* LOGO DI ATAS */
        .logo-di-atas {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .logo-di-atas img {
            height: 75px;
            width: auto;
            border-radius: 6px;
        }

        h1 {
            font-size: 2.3rem;
            color: #7B2CBF;
            text-shadow: 0 0 8px rgba(123, 44, 191, 0.3);
            margin-bottom: 15px;
        }
        .info {
            width: 800px;
            display: flex;
            justify-content: center;
            gap: 50px;
            background: rgba(255,255,255,0.6);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.8);
        }
        #notifikasi {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #9D4EDD;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }
        #gameCanvas {
            border: 4px solid #C77DFF;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(199, 125, 255, 0.35);
        }
        .tombol {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            padding: 10px 22px;
            background: linear-gradient(135deg, #9D4EDD, #7B2CBF);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #C77DFF, #9D4EDD);
            box-shadow: 0 0 15px rgba(199, 125, 255, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- LOGO DI ATAS -->
    <div class="logo-di-atas">
        <img src="1sanden.jpeg" alt="Logo Sanden">
        <img src="logosklh.jpeg" alt="Logo Sekolah">
        <img src="mk.jpeg" alt="Logo MOKO">
        <img src="rpl.jpeg" alt="Logo RPL">
    </div>

    <h1>🐍 Cacing Pemakan Buah 🍎</h1>
    <div id="notifikasi"></div>

    <div class="info">
        <div>📈 Level: <span id="level">1</span></div>
        <div>⭐ Skor Kamu: <span id="skor">0</span></div>
        <div>🔗 Panjang Ekor: <span id="panjang">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="tombol">
        <button onclick="mulaiGame()">🎮 Mulai Main</button>
        <button onclick="resetGame()">🔄 Ulangi</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let level = 1, skor = 0;
        let gameJalan = false;

        const pemain = {
            x: 80, y: 200, ukuran: 26, kecepatan: 3.2, kecepatanDasar: 3.2,
            arahX: 1, arahY: 0, ekor: []
        };

        const buah = {x: acak(100, 700), y: acak(50, 350), ukuran: 24, warna: '#E63946'};

        const tombol = {};
        window.addEventListener('keydown', e => {
            tombol[e.key] = true;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', e => tombol[e.key] = false);

        function acak(min, max) { return Math.floor(Math.random()*(max-min)+min); }
        function notifikasi(teks) {
            const n = document.getElementById('notifikasi');
            n.innerText = teks; n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 2000);
        }

        function mulaiGame() {
            if (gameJalan) return;
            gameJalan = true;
            notifikasi('MAIN BEBAS! Hanya Nabrak = Kalah!');
            loopGame();
        }

        function resetGame() {
            gameJalan = false;
            level = 1; skor = 0;
            pemain.x = 80; pemain.y = 200; pemain.ekor = [];
            pemain.arahX = 1; pemain.arahY = 0;
            pemain.kecepatan = pemain.kecepatanDasar;
            buah.x = acak(100, 700); buah.y = acak(50, 350);
            updateUI(); gambarSemua();
        }

        function loopGame() {
            if (!gameJalan) return;
            ubahArah(); gerakOtomatis(); updateEkor(); cekTabrakanDinding(); cekMakanBuah();
            gambarSemua(); updateUI(); requestAnimationFrame(loopGame);
        }

        function ubahArah() {
            if (tombol['ArrowUp'] && pemain.arahY !== 1) { pemain.arahX = 0; pemain.arahY = -1; }
            if (tombol['ArrowDown'] && pemain.arahY !== -1) { pemain.arahX = 0; pemain.arahY = 1; }
            if (tombol['ArrowLeft'] && pemain.arahX !== 1) { pemain.arahX = -1; pemain.arahY = 0; }
            if (tombol['ArrowRight'] && pemain.arahX !== -1) { pemain.arahX = 1; pemain.arahY = 0; }
        }

        function gerakOtomatis() {
            pemain.x += pemain.arahX * pemain.kecepatan;
            pemain.y += pemain.arahY * pemain.kecepatan;
        }

        // 🔴 HANYA KALAH JIKA NABRAK DINDING
        function cekTabrakanDinding() {
            if (pemain.x <= 0 || pemain.x >= canvas.width - pemain.ukuran ||
                pemain.y <= 0 || pemain.y >= canvas.height - pemain.ukuran) {
                gameJalan = false;
                notifikasi(`💥 KALAH! Skor Akhir: ${skor}`);
            }
        }

        function updateEkor() {
            pemain.ekor.unshift({x: pemain.x, y: pemain.y});
            while(pemain.ekor.length > skor) pemain.ekor.pop();
        }

        // ✅ TIDAK ADA BATAS LEVEL/SKOR: MAKAN TERUS SAMPAI KAPAN PUN
        function cekMakanBuah() {
            if (Math.abs(pemain.x - buah.x) < 30 && Math.abs(pemain.y - buah.y) < 30) {
                skor++;
                buah.x = acak(100, 700); buah.y = acak(50, 350);
                // Kecepatan naik terus, TIDAK BERHENTI DI LEVEL 5
                if (skor % 5 === 0) { 
                    level++; 
                    pemain.kecepatan += 0.35; 
                    notifikasi(`Level ${level}! Semakin Cepat! 🚀`); 
                }
            }
        }

        // ✅ LATAR KOTAK-KOTAK HALUS UNGU (TIDAK POLOS, TIDAK ADA AWAN)
        function gambarSemua() { gambarLatar(); gambarEkor(); gambarPemain(); gambarBuah(); }

        function gambarLatar() {
            ctx.fillStyle = '#F0EBFF';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            
            // Garis kotak-kotak halus
            ctx.strokeStyle = '#E0D6FF';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 25) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let j = 0; j < canvas.height; j += 25) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }
        }

        function gambarEkor() {
            for(let i=0; i<pemain.ekor.length; i++) {
                let b = pemain.ekor[i];
                ctx.fillStyle = `rgb(${140-i*2}, ${110+i*3}, ${230})`;
                ctx.shadowBlur=3; ctx.beginPath(); ctx.arc(b.x,b.y,pemain.ukuran/2 - i*0.7,0,Math.PI*2); ctx.fill();
            } ctx.shadowBlur=0;
        }

        function gambarPemain() {
            ctx.fillStyle = '#7B2CBF'; ctx.shadowColor = '#9D4EDD'; ctx.shadowBlur=10;
            ctx.beginPath(); ctx.arc(pemain.x,pemain.y,pemain.ukuran/2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(pemain.x+7,pemain.y-4,5,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(pemain.x+8,pemain.y-4,2.5,0,Math.PI*2); ctx.fill();
        }

        function gambarBuah() {
            ctx.fillStyle = buah.warna; ctx.shadowColor='#E63946'; ctx.shadowBlur=12;
            ctx.beginPath(); ctx.arc(buah.x,buah.y,buah.ukuran/2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            ctx.fillStyle='#228B22'; ctx.fillRect(buah.x-2, buah.y-14, 4, 8);
        }

        function updateUI() {
            document.getElementById('level').innerText=level;
            document.getElementById('skor').innerText=skor;
            document.getElementById('panjang').innerText=skor;
        }

        gambarSemua();
    </script>
</body>
</html>
