<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacing Pemakan Buah 🍎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body {
            /* GANTI BACKGROUND JADI UNGU LILAC KALEM */
            background: linear-gradient(to bottom, #B8A9C9, #F5F0FF);
            min-height: 100vh;
            padding: 20px;
            color: #4A4063; /* Warna teks disesuaikan agar terbaca di latar ungu */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === LOGO DI TENGAH LATAR BELAKANG (SAMAR) === */
        .logo-tengah {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 25px;
            opacity: 0.10; /* Lebih samar agar makin kalem */
            pointer-events: none;
            z-index: 0;
        }
        .logo-tengah img {
            height: 90px;
            width: auto;
        }

        h1 {
            font-size: 2.3rem;
            color: #7B2CBF; /* Ungu tua cerah */
            text-shadow: 0 0 8px rgba(123, 44, 191, 0.3);
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }
        .info {
            width: 800px;
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.6);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.8);
            position: relative;
            z-index: 1;
        }
        #notifikasi {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #9D4EDD;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }
        #gameCanvas {
            border: 4px solid #C77DFF;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(199, 125, 255, 0.35);
            background: #F8F5FF;
            position: relative;
            z-index: 1;
        }
        .tombol {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        button {
            padding: 10px 22px;
            background: linear-gradient(135deg, #9D4EDD, #7B2CBF);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #C77DFF, #9D4EDD);
            box-shadow: 0 0 15px rgba(199, 125, 255, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 🔴 LOGO DENGAN NAMA FILE YANG TEPAT -->
    <div class="logo-tengah">
        <img src="1sanden.jpeg" alt="Logo Sanden">
        <img src="logosklh.jpeg" alt="Logo Sekolah">
        <img src="mk.jpeg" alt="Logo MOKO">
        <img src="rpl.jpeg" alt="Logo RPL">
    </div>

    <h1>🐍 CACING PEMAKAN BUAH 🍎</h1>
    <div id="notifikasi"></div>

    <div class="info">
        <div>⏱️ Waktu: <span id="waktu">60</span> dtk</div>
        <div>📈 Level: <span id="level">1</span></div>
        <div>⭐ Skor Kamu: <span id="skor">0</span></div>
        <div>🔗 Panjang Ekor: <span id="panjang">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="tombol">
        <button onclick="mulaiGame()">🎮 Mulai Main</button>
        <button onclick="resetGame()">🔄 Ulangi</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let waktu = 60, level = 1, skor = 0;
        let gameJalan = false;

        // Objek Cacing
        const pemain = {
            x: 80, y: 200, ukuran: 26, kecepatan: 3.5, kecepatanDasar: 3.5,
            arahX: 1, arahY: 0,
            ekor: []
        };

        // Buah
        const buah = {x: 500, y: acak(50,350), ukuran: 24, warna: '#E63946'};

        const tombol = {};
        window.addEventListener('keydown', e => {
            tombol[e.key] = true;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', e => tombol[e.key] = false);

        function acak(min, max) { return Math.floor(Math.random()*(max-min)+min); }
        function notifikasi(teks) {
            const n = document.getElementById('notifikasi');
            n.innerText = teks; n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 3000);
        }

        function mulaiGame() {
            if (gameJalan) return;
            gameJalan = true;
            notifikasi('Permainan Dimulai! 🎮');
            
            const timer = setInterval(() => {
                if (!gameJalan) { clearInterval(timer); return; }
                waktu--;
                document.getElementById('waktu').innerText = waktu;
                if (waktu <= 0) {
                    gameJalan = false;
                    notifikasi(`SELESAI! Skor Akhir: ${skor} 🎉`);
                    clearInterval(timer);
                }
            }, 1000);

            loopGame();
        }

        function resetGame() {
            gameJalan = false;
            waktu = 60; level = 1; skor = 0;
            pemain.x = 80; pemain.y = 200; pemain.ekor = [];
            pemain.arahX = 1; pemain.arahY = 0;
            pemain.kecepatan = pemain.kecepatanDasar;
            buah.x = 500; buah.y = acak(50,350);
            updateUI(); gambarLatar();
        }

        function loopGame() {
            if (!gameJalan) return;

            ubahArah();
            gerakOtomatis();
            updateEkor();
            cekTabrakanDinding();
            cekMakanBuah();
            gambarSemua();
            updateUI();

            requestAnimationFrame(loopGame);
        }

        // === PENGENDALIAN ARAH ===
        function ubahArah() {
            if (tombol['ArrowUp'] && pemain.arahY !== 1) {
                pemain.arahX = 0; pemain.arahY = -1;
            }
            if (tombol['ArrowDown'] && pemain.arahY !== -1) {
                pemain.arahX = 0; pemain.arahY = 1;
            }
            if (tombol['ArrowLeft'] && pemain.arahX !== 1) {
                pemain.arahX = -1; pemain.arahY = 0;
            }
            if (tombol['ArrowRight'] && pemain.arahX !== -1) {
                pemain.arahX = 1; pemain.arahY = 0;
            }
        }

        // === GERAKAN OTOMATIS ===
        function gerakOtomatis() {
            pemain.x += pemain.arahX * pemain.kecepatan;
            pemain.y += pemain.arahY * pemain.kecepatan;
        }

        // === CEK NABRAK DINDING ===
        function cekTabrakanDinding() {
            if (pemain.x <= 0 || pemain.x >= canvas.width - pemain.ukuran ||
                pemain.y <= 0 || pemain.y >= canvas.height - pemain.ukuran) {
                gameJalan = false;
                notifikasi(`💥 NABRAK DINDING! Skor: ${skor}`);
            }
        }

        // === SISTEM EKOR & KECEPATAN ===
        function updateEkor() {
            pemain.ekor.unshift({x: pemain.x, y: pemain.y});
            while(pemain.ekor.length > skor) { pemain.ekor.pop(); }
        }

        // === MAKAN BUAH & NAIK LEVEL ===
        function cekMakanBuah() {
            if (Math.abs(pemain.x - buah.x) < 30 && Math.abs(pemain.y - buah.y) < 30) {
                skor++;
                buah.x = acak(100, 700);
                buah.y = acak(50, 350);
                if (skor % 5 === 0) { 
                    level++; 
                    pemain.kecepatan += 0.4;
                    notifikasi(`Level ${level}! Lebih Cepat! 🚀`); 
                    waktu += 5; 
                }
            }
        }

        // === GAMBARAN ===
        function gambarSemua() { gambarLatar(); gambarEkor(); gambarPemain(); gambarBuah(); }

        // === BACKGROUND DALAM GAME (DI DALAM KANVAS) ===
        function gambarLatar() {
            let grad = ctx.createLinearGradient(0,0,0,canvas.height);
            grad.addColorStop(0, '#E0D4FF'); grad.addColorStop(1, '#F3E8FF');
            ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);

            ctx.fillStyle = '#FFD700'; ctx.shadowColor = '#FFD700'; ctx.shadowBlur=15;
            ctx.beginPath(); ctx.arc(720, 60, 35, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;

            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            gambarAwan(120, 80); gambarAwan(350, 50); gambarAwan(600, 90);
        }
        function gambarAwan(x,y) {
            ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.arc(x+25,y-8,25,0,Math.PI*2); ctx.arc(x+50,y,20,0,Math.PI*2); ctx.fill();
        }

        function gambarEkor() {
            for(let i=0; i<pemain.ekor.length; i++) {
                let b = pemain.ekor[i];
                ctx.fillStyle = `rgb(${140-i*2}, ${110+i*3}, ${230})`;
                ctx.shadowBlur=3; ctx.beginPath(); ctx.arc(b.x,b.y,pemain.ukuran/2 - i*0.7,0,Math.PI*2); ctx.fill();
            } ctx.shadowBlur=0;
        }

        function gambarPemain() {
            ctx.fillStyle = '#7B2CBF'; ctx.shadowColor = '#9D4EDD'; ctx.shadowBlur=10;
            ctx.beginPath(); ctx.arc(pemain.x,pemain.y,pemain.ukuran/2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            
            // Mata
            ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(pemain.x+7,pemain.y-4,5,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(pemain.x+8,pemain.y-4,2.5,0,Math.PI*2); ctx.fill();
        }

        function gambarBuah() {
            ctx.fillStyle = buah.warna; ctx.shadowColor='#E63946'; ctx.shadowBlur=12;
            ctx.beginPath(); ctx.arc(buah.x,buah.y,buah.ukuran/2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            ctx.fillStyle='#228B22'; ctx.fillRect(buah.x-2, buah.y-14, 4, 8);
        }

        function updateUI() {
            document.getElementById('waktu').innerText=waktu;
            document.getElementById('level').innerText=level;
            document.getElementById('skor').innerText=skor;
            document.getElementById('panjang').innerText=skor;
        }

        gambarLatar(); gambarPemain(); gambarBuah();
    </script>
</body>
</html>
