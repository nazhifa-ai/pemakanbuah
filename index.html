<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacing Pemakan Buah 🍎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #EDE7F6, #D1C4E9);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* LOGO */
        .logo-di-atas {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }
        .logo-di-atas img {
            height: 72px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(123, 31, 162, 0.15);
        }

        /* JUDUL */
        h1 {
            font-size: 2.5rem;
            color: #6A1B9A;
            text-align: center;
            margin-bottom: 18px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(106, 27, 154, 0.2);
        }

        /* INFO */
        .info {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
        }
        .info-item {
            background: linear-gradient(135deg, #9575CD, #7E57C2);
            padding: 12px 28px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 1.15rem;
            box-shadow: 0 4px 15px rgba(126, 87, 194, 0.35);
            letter-spacing: 0.5px;
        }

        /* AREA KANVAS */
        #gameCanvas {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(106, 27, 154, 0.25);
            background: #FAF7FF;
            position: relative;
        }

        /* ✨ TULISAN TENGAH ✨ */
        .tulisan-tengah {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #7E57C2, #6A1B9A);
            padding: 22px 55px;
            border-radius: 35px;
            color: white;
            font-size: 1.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(106, 27, 154, 0.4);
            z-index: 10;
            transition: all 0.3s ease;
            border: 3px solid #B39DDB;
        }
        .tulisan-tengah:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 10px 30px rgba(106, 27, 154, 0.5);
        }

        /* PETUNJUK */
        .petunjuk {
            margin-top: 20px;
            background: rgba(255,255,255,0.85);
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            color: #6A1B9A;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(106, 27, 154, 0.1);
        }
    </style>
</head>
<body>

    <div class="logo-di-atas">
        <img src="1sanden.jpeg" alt="Logo Sanden">
        <img src="logosklh.jpeg" alt="Logo Sekolah">
        <img src="mk.jpeg" alt="Logo MOKO">
        <img src="rpl.jpeg" alt="Logo RPL">
    </div>

    <h1>🐍 CACING PEMAKAN BUAH 🍎</h1>

    <div class="info">
        <div class="info-item">📈 Level: <span id="level">1</span></div>
        <div class="info-item">⭐ Skor: <span id="skor">0</span></div>
        <div class="info-item">🔗 Panjang: <span id="panjang">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div id="tulisanTengah" class="tulisan-tengah" onclick="klikTengah()">MULAI PERMAINAN</div>

    <div class="petunjuk">
        Gunakan tombol ⬆️ ⬇️ ⬅️ ➡️ di keyboard untuk menggerakkan cacing
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const elemenTulisan = document.getElementById('tulisanTengah');
        let level = 1, skor = 0;
        let gameJalan = false;

        const pemain = {
            x: 80, y: 200, ukuran: 26, kecepatan: 3.2, kecepatanDasar: 3.2,
            arahX: 1, arahY: 0, ekor: []
        };

        const buah = {x: acak(100, 700), y: acak(50, 350), ukuran: 24, warna: '#D32F2F'};

        const tombol = {};
        window.addEventListener('keydown', e => {
            tombol[e.key] = true;
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', e => tombol[e.key] = false);

        function acak(min, max) { return Math.floor(Math.random()*(max-min)+min); }

        function klikTengah() {
            if (!gameJalan) mulaiGame();
        }

        function mulaiGame() {
            gameJalan = true;
            elemenTulisan.style.display = 'none';
            loopGame();
        }

        function resetGame() {
            gameJalan = false;
            level = 1; skor = 0;
            pemain.x = 80; pemain.y = 200; pemain.ekor = [];
            pemain.arahX = 1; pemain.arahY = 0;
            pemain.kecepatan = pemain.kecepatanDasar;
            buah.x = acak(100, 700); buah.y = acak(50, 350);
            updateUI(); gambarSemua();
            elemenTulisan.innerText = 'ULANGI';
            elemenTulisan.style.display = 'block';
        }

        // 🔴 LOOP TANPA BATAS
        function loopGame() {
            if (!gameJalan) return;
            ubahArah(); gerakOtomatis(); updateEkor(); cekTabrakanDinding(); cekMakanBuah();
            gambarSemua(); updateUI(); requestAnimationFrame(loopGame);
        }

        function ubahArah() {
            if (tombol['ArrowUp'] && pemain.arahY !== 1) { pemain.arahX = 0; pemain.arahY = -1; }
            if (tombol['ArrowDown'] && pemain.arahY !== -1) { pemain.arahX = 0; pemain.arahY = 1; }
            if (tombol['ArrowLeft'] && pemain.arahX !== 1) { pemain.arahX = -1; pemain.arahY = 0; }
            if (tombol['ArrowRight'] && pemain.arahX !== -1) { pemain.arahX = 1; pemain.arahY = 0; }
        }

        function gerakOtomatis() {
            pemain.x += pemain.arahX * pemain.kecepatan;
            pemain.y += pemain.arahY * pemain.kecepatan;
        }

        function cekTabrakanDinding() {
            if (pemain.x <= 0 || pemain.x >= canvas.width - pemain.ukuran ||
                pemain.y <= 0 || pemain.y >= canvas.height - pemain.ukuran) {
                resetGame();
            }
        }

        function updateEkor() {
            pemain.ekor.unshift({x: pemain.x, y: pemain.y});
            while(pemain.ekor.length > skor) pemain.ekor.pop();
        }

        // ⭐ TIDAK ADA BATAS LEVEL
        function cekMakanBuah() {
            if (Math.abs(pemain.x - buah.x) < 30 && Math.abs(pemain.y - buah.y) < 30) {
                skor++;
                buah.x = acak(100, 700); buah.y = acak(50, 350);
                if (skor % 5 === 0) { level++; pemain.kecepatan += 0.2; }
            }
        }

        // 🎨 BACKGROUND LINGKARAN & GRADASI ELEGAN
        function gambarSemua() { gambarLatar(); gambarEkor(); gambarPemain(); gambarBuah(); }

        function gambarLatar() {
            let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#FFFFFF');
            grad.addColorStop(1, '#F3E5F5');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(206, 147, 216, 0.35)';
            ctx.beginPath(); ctx.arc(120, 100, 70, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(680, 300, 90, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(600, 80, 50, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(200, 350, 80, 0, Math.PI*2); ctx.fill();
        }

        function gambarEkor() {
            for(let i=0; i<pemain.ekor.length; i++) {
                let b = pemain.ekor[i];
                ctx.fillStyle = `rgb(${120-i*2}, ${80+i*4}, ${200+i*10})`;
                ctx.shadowBlur=4; ctx.shadowColor='#B39DDB';
                ctx.beginPath(); ctx.arc(b.x,b.y,pemain.ukuran/2 - i*0.6,0,Math.PI*2); ctx.fill();
            } ctx.shadowBlur=0;
        }

        function gambarPemain() {
            ctx.fillStyle = '#4A148C'; ctx.shadowColor = '#7E57C2'; ctx.shadowBlur=12;
            ctx.beginPath(); ctx.arc(pemain.x,pemain.y,pemain.ukuran/2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(pemain.x+7,pemain.y-4,5,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(pemain.x+8,pemain.y-4,2.5,0,Math.PI*2); ctx.fill();
        }

        function gambarBuah() {
            ctx.fillStyle = buah.warna; ctx.shadowColor='#EF9A9A'; ctx.shadowBlur=15;
            ctx.beginPath(); ctx.arc(buah.x,buah.y,buah.ukuran/2,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            ctx.fillStyle='#2E7D32'; ctx.fillRect(buah.x-2, buah.y-14, 4, 8);
        }

        function updateUI() {
            document.getElementById('level').innerText=level;
            document.getElementById('skor').innerText=skor;
            document.getElementById('panjang').innerText=skor;
        }

        gambarSemua();
    </script>
</body>
</html>
